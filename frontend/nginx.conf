# nginx bên trong image frontend: chỉ phục vụ file tĩnh của React (SPA). HTTPS, /api, giới hạn request
# nằm ở nginx ngoài cùng (infra/nginx/templates/default.conf.template).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite gắn hash vào tên file trong /assets -> file đổi là đổi URL, cho trình duyệt cache 1 năm.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html không cache: luôn trỏ đúng bộ /assets mới nhất sau mỗi lần deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
