name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --config=/repo/.gitleaks.toml --gitleaks-ignore-path=/repo/.gitleaksignore --redact -v

      - name: Block build artifacts
        run: |
          BAD=$(git ls-files | grep -E '(^|/)(target|node_modules|dist|build|coverage)/|\.(class|jar|war)$|(^|/)\.env$|\.(pem|key|p12|pfx|jks|keystore)$' | grep -v '\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Phát hiện file build/secret bị commit:"
            echo "$BAD"
            exit 1
          fi
