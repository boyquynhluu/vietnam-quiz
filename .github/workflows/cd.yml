# CD: merge vào main (hoặc bấm "Run workflow") -> chạy lại CI -> build 2 image đẩy lên GitHub Container Registry
# (ghcr.io) -> SSH vào VPS -> kéo image -> khởi động lại -> kiểm tra health, lỗi thì quay về bản cũ.
#
# Cấu hình 1 lần trong GitHub: Settings -> Environments -> "production"
#   Secrets : VPS_HOST, VPS_USER, VPS_SSH_KEY (private key), VPS_KNOWN_HOSTS (kết quả ssh-keyscan), VPS_PORT (tuỳ chọn)
#   Variables (tuỳ chọn): APP_DIR (mặc định /opt/vietnam-quiz), APP_URL (vd https://quiz.example.com — smoke test)
#   Bật "Required reviewers" nếu muốn bấm duyệt tay trước mỗi lần deploy.
# Trên VPS cần sẵn: Docker + compose plugin, thư mục APP_DIR/infra có file .env (tạo bằng infra/init-env.sh prod).
name: CD

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'loadtest/**']
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: Chỉ build & đẩy image, không deploy
        type: boolean
        default: false

permissions:
  contents: read

# Không chạy 2 lần deploy cùng lúc; lần sau chờ lần trước xong (không huỷ giữa chừng)
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    name: Build & push images
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Tên image & tag (GHCR yêu cầu chữ thường)
        run: |
          echo "prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/backend:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}/frontend:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Tóm tắt
        run: |
          {
            echo "### Image đã đẩy"
            echo "- \`${{ steps.meta.outputs.prefix }}/backend:${{ steps.meta.outputs.tag }}\`"
            echo "- \`${{ steps.meta.outputs.prefix }}/frontend:${{ steps.meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy VPS
    needs: images
    if: ${{ !inputs.skip_deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.APP_DIR || '/opt/vietnam-quiz' }}
      TAG: ${{ needs.images.outputs.tag }}
      PREFIX: ${{ needs.images.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Chuẩn bị SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_KEY" ] || [ -z "$VPS_KNOWN_HOSTS" ]; then
            echo "::error::Thiếu secret VPS_HOST / VPS_SSH_KEY / VPS_KNOWN_HOSTS trong environment production"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking yes
          EOF

      - name: Chép cấu hình hạ tầng (compose, nginx, script) — không đụng infra/.env trên server
        run: |
          tar czf - --exclude='.env' --exclude='.env.*' infra \
            | ssh vps "mkdir -p '$APP_DIR' && tar xzf - -C '$APP_DIR' && chmod +x '$APP_DIR'/infra/*.sh"

      - name: Kéo image & khởi động lại
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # token chỉ sống trong job này: đăng nhập ghcr, kéo image, đăng xuất ngay trong deploy.sh
          printf '%s' "$GHCR_TOKEN" | ssh vps \
            "GHCR_USER='$GHCR_USER' IMAGE_PREFIX='$PREFIX' bash '$APP_DIR/infra/deploy.sh' '$TAG'"

      - name: Smoke test
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 10); do
            curl -fsS "${{ vars.APP_URL }}/api/categories" >/dev/null && exit 0
            sleep 6
          done
          echo "Smoke test failed" && exit 1

      - name: Tóm tắt
        if: always()
        run: echo "### Deploy \`${TAG}\` lên VPS — ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
