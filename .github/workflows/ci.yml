# CI: chạy khi push / mở PR, và được cd.yml gọi lại trước khi build image (workflow_call).
#   backend : mvn verify
#   frontend: npm ci -> eslint -> vite build
#   nginx   : render template + nginx -t
#   docker  : build thử 2 image (không đẩy đi) để bắt lỗi Dockerfile sớm — chỉ chạy trên PR
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'loadtest/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

# Push liên tiếp lên cùng nhánh: huỷ lần chạy cũ (không áp dụng khi được cd.yml gọi)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test & package
        run: mvn -B -ntp verify

      - name: Báo cáo test khi lỗi
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  frontend:
    name: Frontend (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Build (gọi API cùng domain)
        run: npm run build
        env:
          VITE_API_BASE_URL: ''

  nginx:
    name: Nginx config (nginx -t)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render template + kiểm tra cú pháp (chứng chỉ tự ký thay chứng chỉ thật)
        run: |
          docker run --rm -e DOMAIN=ci.example.com \
            -v "$PWD/infra/nginx/templates:/etc/nginx/templates:ro" \
            --entrypoint sh nginx:1.27-alpine -c '
              set -e
              apk add -q openssl >/dev/null
              mkdir -p /etc/letsencrypt/live/$DOMAIN
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj /CN=$DOMAIN \
                -keyout /etc/letsencrypt/live/$DOMAIN/privkey.pem -out /etc/letsencrypt/live/$DOMAIN/fullchain.pem 2>/dev/null
              envsubst "\$DOMAIN" < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
              nginx -t'

  docker:
    name: Docker build (kiểm tra)
    if: github.event_name == 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          build-args: |
            VITE_API_BASE_URL=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
