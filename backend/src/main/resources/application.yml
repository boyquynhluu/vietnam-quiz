spring:
  application:
    name: vietnam-quiz
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: 8080
  # Chạy sau nginx reverse proxy (infra/nginx): đọc X-Forwarded-*
  forward-headers-strategy: framework
  compression:
    enabled: true

# Chỉ mở endpoint health (Docker healthcheck + infra/deploy.sh)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Danh sách cách nhau bởi dấu phẩy. Để trống = tắt CORS (cùng domain).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
