# Môi trường DEV trên máy lập trình.
#   ./init-env.sh dev                   (lần đầu: tạo infra/.env — đã ignore, KHÔNG commit)
#   docker compose -f docker-compose.dev.yml up -d --build      (Compose tự đọc infra/.env)
# Frontend chạy bằng `npm run dev` trong frontend/ (Vite proxy /api -> http://localhost:${BACKEND_PORT:-8080}).
#
# Khác production: profile Spring "dev" (CORS cho Vite, log DEBUG), cổng debug Java ${DEBUG_PORT:-5005},
# mọi cổng chỉ mở trên 127.0.0.1 của máy dev, không có nginx / HTTPS.
name: vietnam-quiz-dev

services:
  backend:
    build: ../backend
    container_name: vietnam-quiz-dev-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      TZ: Asia/Ho_Chi_Minh
      # Gắn debugger của IDE vào localhost:${DEBUG_PORT:-5005}
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
      - "127.0.0.1:${DEBUG_PORT:-5005}:5005"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30
